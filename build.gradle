plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bagusxmahendra.mltf'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.google.adk:google-adk:1.8.0'
	implementation 'com.google.genai:google-genai:1.58.0'
	implementation 'com.google.cloud:google-cloud-storage:2.49.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

abstract class MinikubeDeployTask extends DefaultTask {
	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@TaskAction
	def deploy() {
		def version = project.version.toString()

		println ">>> [1/3] Building Docker image directly in Minikube's Docker daemon..."
		execOperations.exec {
			commandLine 'sh', '-c', "eval \"\$(minikube docker-env)\" && docker build --build-arg VERSION=${version} -t document-processing-agent:${version} -t document-processing-agent:latest ."
		}

		println ">>> [2/3] Applying Kubernetes manifests from k8s/..."
		execOperations.exec {
			commandLine 'kubectl', 'apply', '-k', 'k8s', '--server-side', '--force-conflicts'
		}

		println ">>> [3/3] Waiting for document-processing-agent deployment rollout..."
		execOperations.exec {
			commandLine 'kubectl', 'rollout', 'status', 'deployment/document-processing-agent', '--timeout=180s'
		}

		println "\nMinikube Service URL:"
		execOperations.exec {
			commandLine 'minikube', 'service', 'document-processing-agent', '--url'
		}
	}
}

abstract class MinikubeUndeployTask extends DefaultTask {
	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@TaskAction
	def undeploy() {
		execOperations.exec {
			commandLine 'kubectl', 'delete', '-k', 'k8s', '--ignore-not-found=true'
		}
	}
}

tasks.register('minikubeDeploy', MinikubeDeployTask) {
	group = 'deployment'
	description = 'Builds the Docker image in Minikube, applies k8s manifests, and waits for rollout.'
	dependsOn 'bootJar'
}

tasks.register('minikubeUndeploy', MinikubeUndeployTask) {
	group = 'deployment'
	description = 'Deletes document-processing-agent resources from Minikube.'
}
