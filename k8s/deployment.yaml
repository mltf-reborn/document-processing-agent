apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-processing-agent
  labels:
    app: document-processing-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-processing-agent
  template:
    metadata:
      labels:
        app: document-processing-agent
    spec:
      containers:
        - name: document-processing-agent
          image: document-processing-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: document-processing-agent-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: document-processing-agent-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3