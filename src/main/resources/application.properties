spring.application.name=document-processing-agent
server.port=8081

# Import local secrets if present (gitignored for production security)
spring.config.import=optional:classpath:application-secret.properties

# Google Gemini & ADK Configuration
google.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
google.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
google.gemini.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:}}
google.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
google.gemini.use-vertex-ai=${GOOGLE_GENAI_USE_VERTEXAI:false}
google.gemini.temperature=0.1
google.gemini.timeout-seconds=90

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
